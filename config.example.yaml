engram:
  base_url: http://127.0.0.1:7437
  default_project: omnia

# Per-origin project routing.
# Resolution order: routes map → default (repo name / guild slug) → default_project.
# github key format: github/{owner}/{repo}
# discord key format: discord/{channel_id}
routes:
  github/arratiabenjamin/saluvita: saluvita
  # discord/123456789: saluvita

sources:
  discord:
    enabled: false
    channels:
      - id: "123456789"
        name: dev-help
        guild: my-server

  github:
    enabled: true
    repos:
      - owner/repo

  # P1 (docs/conversational-retrieval-plan.md "Ingest repository
  # documentation as memories"): local, no-network ingestion of THIS repo's
  # own README/VISION/ARCHITECTURE/CONTRIBUTING/docs/adr/openspec-specs
  # markdown, so an identity question ("what is Omnia") has an actual
  # document to retrieve instead of nothing. Disabled by default.
  # repo_root must be an absolute path to a git working tree's top level;
  # left empty (the default), `omnia collect -source repodoc` uses the
  # current working directory at run time. project falls back to
  # engram.default_project above when unset. allowlist overrides
  # repodoc.DefaultAllowlist only when non-empty — leave it unset to track
  # that package's own default list.
  # repodoc:
  #   enabled: true
  #   repo_root: /absolute/path/to/repo
  #   project: omnia
  #   allowlist:
  #     - "README*"
  #     - "docs/**/*.md"

backfill_days: 30

# Omnia's own local semantic-search index. Disabled by default: off keeps
# `omnia embed` a no-op and the dashboard serves keyword (FTS) search only.
# model accepts any Ollama-served embedding model; jina/jina-embeddings-v2-base-es
# is the shipped default and stays default until an eval-gated swap is
# recorded (no code changes needed to select a different model).
# embeddinggemma:300m (Google's Matryoshka-trained 300M-parameter model) is a
# selectable MRL-capable alternative: for MRL-capable models only, dim may be
# set BELOW the model's native output (768/256/128) to truncate + re-normalize
# instead of always using the full dimension. Setting dim below a NON-MRL
# model's native output (e.g. jina below 768) is rejected at config-validation
# time, not silently truncated.
# embeddings:
#   enabled: true
#   base_url: http://localhost:11434  # Ollama base URL
#   model: jina/jina-embeddings-v2-base-es  # or embeddinggemma:300m (MRL-capable)
#   dim: 768  # embeddinggemma:300m also accepts 256 or 128 (Matryoshka truncation)
#   db_path: ~/.local/share/omnia/embeddings.db

# Hybrid (lexical+semantic) recall fusion for mem_search AND (P0,
# docs/conversational-retrieval-plan.md) GET /search. Disabled by default:
# off calls store.Search directly, byte-for-byte today's FTS5-only path —
# zero engram.db migration. Requires `embeddings.enabled: true` above.
#
# ranking is an optional recency x importance x relevance x salience re-sort
# pass over the fused/searched results, run by mcp.RankPipeline for BOTH
# mem_search and GET /search (P0: the two consumers share one pipeline, so
# this key now affects the voice agent too, not just the coding agent).
# Disabled by default: off keeps relevance-only ordering, byte-for-byte
# today's. recency_half_life_days controls how fast the recency component
# decays (1.0 at zero elapsed days, 0.5 at this many days). weights.salience
# is the one weight with NO auto-default (stays 0 until set explicitly) —
# see RankingWeights' own doc in internal/config/config.go for why.
# recall:
#   enabled: true
#   rrf_k: 60
#   dense_k: 5
#   strong_floor: 0.65
#   base_floor: 0.55
#   max_results: 50
#   ranking:
#     enabled: true
#     recency_half_life_days: 14
#     weights:
#       recency: 1.0
#       importance: 1.0
#       relevance: 1.0
#       salience: 0.0
#   # P6 (docs/conversational-retrieval-plan.md "Query embedding cache"): an
#   # in-process LRU from normalized query string -> embedding vector,
#   # wrapping the Searcher recall.Service.Semantic uses. Nearly free, and
#   # explicitly a candidate for deletion if real-traffic hit rate stays
#   # under ~20% (see GET /health's query_cache.hit_rate). max_entries <= 0
#   # (including unset) uses internal/embed's own default of 200.
#   query_cache:
#     enabled: true
#     max_entries: 200

# memory-structural-forgetting: downranks (never excludes) a memory that
# carries at least one code anchor whose file changed since it was saved —
# run by mcp.RankPipeline for both mem_search and GET /search (P0). Disabled
# by default: off keeps handleSearch/GET /search byte-for-byte identical to
# today, with no anchor_receipt line and no staleness_penalty in any
# explain/score_breakdown output.
# structural_forgetting:
#   enabled: true

# Omnia v0.3 "Context Economy": token-based injection budget for mem_search.
# Disabled by default: off keeps handleSearch's output byte-for-byte
# identical to today. Top-ranked results are kept COMPLETE, in rank order,
# until the next one would exceed max_tokens (estimated via a cheap
# char/4 heuristic, not a real tokenizer) — no result is ever partially
# truncated. The topic_key exact-match sentinel and error-signature-match
# rows are always emitted complete and never count against this budget.
#
# context_budget is FormatContext's own aggregate token budget (mem_context /
# `omnia context` / the dashboard), fixing a pre-existing defect: each of its
# four buckets (pinned / recent observations / recent sessions / recent
# prompts) was individually per-item truncated but never capped IN TOTAL.
# Disabled by default: off keeps today's uncapped-total output. When
# enabled, the budget is consumed in PRIORITY order — pinned first (never
# starved), then recent observations, then recent sessions, then recent
# prompts last — regardless of their display order in the rendered text.
#
# diversity is an MMR (maximal marginal relevance) style read-time re-rank
# that demotes/hard-drops mem_search rows near-duplicating an already-picked
# higher-ranked row, using a cheap token-set Jaccard similarity over the
# hydrated content (no new embedding calls, no new model dependency).
# Disabled by default: off keeps handleSearch's order byte-for-byte
# identical to today. lambda balances relevance against diversity in the
# greedy reselection (higher = favor relevance, lower = favor diversity);
# similarity_threshold is the hard-drop cutoff — a candidate whose
# similarity to an already-picked row meets or exceeds it is dropped
# entirely as a near-duplicate, not merely reordered.
#
# type_lens is a situational type boost: it infers a likely-relevant memory
# type from the mem_search query text (e.g. an error/panic/crash-ish query
# implies "bugfix"; a decide/tradeoff-ish query implies "decision") and
# lifts matching-type rows above non-matching ones, on top of the existing
# importance-tier ordering — it never excludes results, only re-orders.
# Disabled by default: off keeps handleSearch's order byte-for-byte
# identical to today. An explicit mem_search `type` argument always wins:
# the lens stands down entirely for any type-scoped search.
# injection:
#   budget:
#     enabled: true
#     max_tokens: 400   # v0.3.1 default (was 1500; explicit values are never migrated)
#   context_budget:
#     enabled: true
#     max_tokens: 1500
#   diversity:
#     enabled: true
#     lambda: 0.7
#     similarity_threshold: 0.9
#   type_lens:
#     enabled: true

# v0.3.1 Write Hygiene — the save-side gate (DEFAULT-ON, unlike every
# injection.* gate above). Uncomment only to change thresholds or to turn
# the gate OFF (the kill-switch): with `enabled: false`, save behavior is
# byte-for-byte identical to pre-v0.3.1.
# write_hygiene:
#   enabled: true
#   noop_threshold: 0.98    # >= : content-identical -> NOOP, returns existing ID
#   update_threshold: 0.9   # >  : same fact, more info -> auto-update (never at exactly 0.9)
#   shrink_guard: 0.9       # auto-update never shrinks content below this fraction
#   candidate_limit: 10     # FTS-prefiltered candidates scored per save

# ─── P0: GET /search "voice profile" (docs/conversational-retrieval-plan.md) ──
#
# Before P0, GET /search (used by the Vel voice assistant via Hermes) ran
# ONLY recall.Fuse + hydrate + a bare JSON array — none of the
# ranking/diversity/budget/degradation machinery mem_search already had.
# cmd/omnia's buildHTTPSearchFunc now runs the exact same mcp.RankPipeline
# mem_search does, gated by the SAME keys documented above (recall.ranking,
# structural_forgetting, injection.diversity, injection.type_lens,
# injection.budget) — every stage is still off by default and independently
# gated, so turning the voice profile on/off is always a config.yaml edit,
# never a code change (rollback: comment these back out).
#
# A reasonable profile for a voice consumer with a small context budget
# (Hermes' own ~1400-character response budget, roughly 350 estimated
# tokens via internal/token.EstimateTokens' char/4 heuristic):
# recall:
#   ranking:
#     enabled: true
# injection:
#   diversity:
#     enabled: true   # MMR near-duplicate removal — a voice reply has no
#                      # room for two near-identical hits
#   budget:
#     enabled: true
#     max_tokens: 350  # ≈ Hermes' ~1400-character response budget
#
# GET /search's own per-request query params (no config needed for these):
#   ?envelope=1     opts into the widened response ({results, recall_degraded,
#                   recall_degraded_reason, embeddings_stale,
#                   embeddings_behind_by, newest_embedded_at} instead of the
#                   legacy bare array — Hermes migrates to this on its own
#                   schedule, per P0's back-compat requirement).
#   ?max_tokens=N   per-request override for injection.budget.max_tokens —
#                   applies even when injection.budget.enabled is false.
#   ?explain=1      per-row score_breakdown (implies envelope=1 — a bare
#                   array result has no field to attach it to).
#   ?type=bugfix    unchanged from before P0; now ALSO routes into the
#                   situational type lens (stands the lens down for that
#                   query, same "explicit filter always wins" rule
#                   mem_search's own `type` arg has always followed).

# ─── P2: query intent classification and routing (docs/conversational-retrieval-plan.md) ──
#
# internal/intent classifies a query (identity/status/delta/open_items/
# rationale/cross_project/unknown — lexical + pattern matching, ES/EN, no
# LLM, <1ms) and mcp.RankPipeline overlays its routing profile onto the
# ranking/type-lens inputs above for that one query: e.g. an identity
# question ("qué es Omnia") gets recency zeroed and a "doc" type-lens hint;
# a status question ("cómo va Workly") gets a short recency half-life. An
# explicit `type` filter (mem_search's `type` arg / GET /search's `?type=`)
# ALWAYS wins over any intent-derived lens hint — unchanged from P0's own
# "Explicit User Filter Always Wins" rule. Disabled by default: off means
# intent.Classify is never even called, and mem_search/GET /search stay
# byte-for-byte identical to today. The classified intent is also surfaced
# informationally (mem_search's "intent" envelope key, GET
# /search?envelope=1's "intent" field) whenever this is on, regardless of
# whether recall.ranking/injection.type_lens are themselves enabled — an
# intent-derived overlay only has an effect once its target stage is on.
# intent_routing:
#   enabled: true

# ─── P3: GET /answer, answer-shaped context endpoint (docs/conversational-retrieval-plan.md) ──
#
# GET /answer?q=…&max_chars=1400 returns {context, confidence, intent,
# sources, degraded} — a deterministically ASSEMBLED, budgeted answer
# context (no LLM call inside the endpoint) plus a calibrated
# high/low/none confidence signal, so a consumer (Hermes, via Vel) no
# longer has to reimplement structured-field extraction (and the
# raw-character-slice bug that caused a markdown heading to reach an LLM
# as if it were prose — see the plan's own opening section). `sources`
# cite `sync_id` only, never the integer `id` (verified to diverge across
# replicas).
#
# All three fields below always get a default (see config.go's
# applyDefaults) — unlike every other block on this page, GET /answer has no
# pre-existing behavior to preserve, so there is no "off by default" gate
# here.
#
# none_score_floor/confidence_threshold are a TWO-FLOOR pair over the top
# result's raw RRF fusion score: below none_score_floor -> confidence
# "none", below confidence_threshold -> "low", else "high" (subject to other
# structural low-triggers). MEASURED (2026-08-14), full grid swept against
# the live store, `omnia eval --profile conversational --target answer`:
# NO (floorA, floorB) pair clears both P3 targets simultaneously —
# false_refusal (identity/status, target <=0.05) and false_confidence
# (absence, target <=0.1) trade off directly against each other, because
# the absence class's score range sits almost entirely INSIDE the identity/
# status range on this store (RRF fusion score is a rank-position
# combinator, not a magnitude signal — it does not separate "found the
# right answer" from "found something vaguely similar"). See
# AnswerConfig's own doc comment (internal/config/config.go) for the full
# 10-point grid. Defaults below (0, 0 — both floors disabled) favor the
# plan's own stated priority ("a memory system that says 'no sé' when it
# does know is a worse product than one that guesses") at the cost of
# false_confidence=1.000 — documented, not hidden.
# answer:
#   max_chars: 1400            # default: Hermes' own documented response budget
#   none_score_floor: 0        # floor A — see AnswerConfig's doc for the full grid
#   confidence_threshold: 0    # floor B — does not move either target metric alone
